name: goshyar
description: "گوش‌یار — بازی آموزشی شنیداری برای کودکان ۳ تا ۸ سال"
publish_to: 'none'

# نسخه‌ی قدیمی اندروید versionCode=1 بود؛ این نسخه باید بالاتر باشد تا روی آن نصب شود.
version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  http: ^1.6.0
  provider: ^6.1.5+1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/images/mascot/
    - assets/images/sounds/
    - assets/images/places/
    - assets/images/scenes/
    - assets/audio/sfx/
    - assets/audio/ui/
    - assets/audio/voice/
    - assets/audio/music/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
